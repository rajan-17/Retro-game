<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexus Universal Player</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff0055;
            --accent-violet: #8b5cf6;
            --accent-yellow: #ffe600;
            --accent-green: #33ff33;
            --bg-base: #0a0a12;
            --bg-surface: #12121e;
            --border-arcade: #333355;
            --font-pixel: 'Press Start 2P', monospace;
            --font-retro: 'VT323', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
            font-family: var(--font-retro);
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Screen Stage */
        .stage-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at 50% 50%, #12121e 0%, #000000 90%);
        }

        canvas, #remoteVideo, #remoteFallbackImg {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 3px solid var(--accent-cyan);
            box-shadow: 4px 4px 0px #000, 0 0 30px rgba(0, 240, 255, 0.25);
            max-width: 100%;
            max-height: 100%;
            background: #000;
        }

        /* 2-Player Lobby Modal */
        .mp-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .mp-backdrop.open {
            display: flex;
        }
        .mp-modal {
            width: 100%;
            max-width: 460px;
            background: #10101e;
            border: 3px solid var(--accent-yellow);
            border-radius: 6px;
            padding: 20px;
            box-shadow: 6px 6px 0 #000, 0 0 30px rgba(255, 230, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }
        .mp-title {
            font-family: var(--font-pixel);
            font-size: 12px;
            color: var(--accent-yellow);
            text-shadow: 2px 2px 0 #000;
        }
        .mp-mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .mp-mode-tab {
            font-family: var(--font-pixel);
            font-size: 8px;
            padding: 9px 6px;
            background: #1a1a2e;
            color: #9999bb;
            border: 2px solid var(--border-arcade);
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.4;
        }
        .mp-mode-tab.active {
            background: var(--accent-cyan);
            color: #000;
            border-color: #fff;
        }
        .mp-code-box {
            background: #070710;
            border: 2px solid var(--accent-cyan);
            border-radius: 4px;
            padding: 10px;
        }
        .mp-code-label {
            font-family: var(--font-pixel);
            font-size: 8px;
            color: #8888aa;
            margin-bottom: 6px;
        }
        .mp-code-value {
            font-family: var(--font-pixel);
            font-size: 26px;
            letter-spacing: 8px;
            color: var(--accent-yellow);
            text-shadow: 0 0 12px rgba(255,230,0,0.45), 2px 2px 0 #000;
        }
        .mp-qr-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            padding: 8px;
            border-radius: 4px;
            border: 3px solid #000;
            margin: 0 auto;
        }
        .mp-hint {
            font-family: var(--font-retro);
            font-size: 18px;
            color: #c0c0d8;
            line-height: 1.3;
        }
        .mp-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .guest-audio-banner {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: var(--accent-magenta);
            color: #fff;
            font-family: var(--font-pixel);
            font-size: 9px;
            padding: 10px 16px;
            border: 2px solid #000;
            border-radius: 4px;
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
        }

        /* Guest join errors (room not found / full / host left) */
        .guest-notice {
            position: absolute;
            z-index: 30;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 420px);
            background: #10101e;
            border: 3px solid var(--accent-magenta);
            border-radius: 6px;
            box-shadow: 6px 6px 0 #000, 0 0 30px rgba(255, 0, 85, 0.25);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .guest-notice strong {
            font-family: var(--font-pixel);
            font-size: 13px;
            color: var(--accent-magenta);
            text-shadow: 2px 2px 0 #000;
        }
        .guest-notice p { font-size: 20px; color: #c0c0d8; line-height: 1.2; }
        .guest-notice a {
            align-self: center;
            font-family: var(--font-pixel);
            font-size: 9px;
            color: #000;
            background: var(--accent-cyan);
            padding: 10px 14px;
            border: 2px solid #fff;
            border-radius: 4px;
            text-decoration: none;
            box-shadow: 3px 3px 0 #000;
        }

        /* CRT Scanlines Filter Overlay */
        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.12) 0px,
                rgba(0, 0, 0, 0.12) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            opacity: 0.5;
        }

        /* Nexus Touch Controls Bar */
        .nexus-touch-bar {
            width: 100%;
            padding: 10px 16px env(safe-area-inset-bottom) 16px;
            background: linear-gradient(180deg, #15152a, #0a0a12);
            border-top: 3px solid var(--accent-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        /* D-Pad */
        .dpad-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .dpad-row {
            display: flex;
            gap: 3px;
        }
        .dpad-center {
            width: 36px;
            height: 36px;
            background: #0e1628;
            border-radius: 4px;
        }
        .touch-btn {
            background: #1a1a2e;
            color: #ffffff;
            border: 2px solid var(--border-arcade);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.8);
            transition: transform 0.08s ease, background 0.08s ease;
            font-family: var(--font-pixel);
        }
        .touch-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
            background: var(--accent-cyan);
            color: #000;
            border-color: #ffffff;
        }
        .touch-dpad {
            width: 44px;
            height: 44px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Center Options / Select */
        .nexus-center-btns {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .nexus-pill {
            padding: 5px 14px;
            border-radius: 4px;
            font-family: var(--font-pixel);
            font-size: 8px;
            font-weight: 400;
            letter-spacing: 1px;
            background: #1a1a2e;
            border: 2px solid var(--border-arcade);
            color: #9cb0ce;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.6);
        }
        .nexus-pill:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
            background: var(--accent-cyan);
            color: #000;
        }

        /* Action Cluster */
        .nexus-action-cluster {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .nexus-circle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-family: var(--font-pixel);
            font-size: 14px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.8);
        }
        .btn-action-a {
            background: #0070d1;
            color: #ffffff;
            border-color: var(--accent-cyan);
        }
        .btn-action-b {
            background: #d62246;
            color: #ffffff;
            border-color: var(--accent-magenta);
        }

        /* Top Status Overlay */
        .hud-overlay {
            position: absolute;
            top: 8px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-badge {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--accent-cyan);
            border-radius: 4px;
            padding: 4px 12px;
            font-family: var(--font-pixel);
            font-size: 8px;
            font-weight: 400;
            color: var(--accent-cyan);
            pointer-events: auto;
            letter-spacing: 1px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.6);
            text-shadow: 0 0 6px rgba(0,240,255,0.4);
        }
        .hud-btn {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--border-arcade);
            color: #ffffff;
            border-radius: 4px;
            padding: 4px 10px;
            font-family: var(--font-pixel);
            font-size: 8px;
            font-weight: 400;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.6);
            transition: all 0.1s ease;
        }
        .hud-btn:hover {
            border-color: var(--accent-cyan);
            text-shadow: 0 0 6px rgba(0,240,255,0.4);
        }
        .hud-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        @media (hover: hover) and (pointer: fine) and (min-width: 900px) {
            .nexus-touch-bar {
                display: none;
            }
        }
        @media (max-width: 600px) {
            .hud-overlay {
                flex-wrap: wrap;
                gap: 4px;
                top: 4px;
                left: 6px;
                right: 6px;
            }
            .hud-badge {
                font-size: 7px;
                padding: 3px 7px;
                max-width: 150px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .hud-btn {
                font-size: 7px;
                padding: 3px 6px;
            }
        }
        .hud-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* ===== Touch devices: bigger HUD + system buttons (>= 36-40px tap targets) ===== */
        @media (pointer: coarse), (max-width: 900px) {
            .hud-btn {
                min-height: 36px;
                padding: 6px 10px;
                font-size: 8px;
            }
            .hud-badge {
                font-size: 8px;
                padding: 9px 10px;
            }
            .nexus-pill {
                min-height: 36px;
                min-width: 78px;
            }
            .mp-code-label { font-size: 8px; }
            .mp-modal { max-height: calc(100dvh - 24px); overflow-y: auto; }
        }

        /* ===== Phone / tablet PORTRAIT: HUD above the screen, big thumb pad below ===== */
        @media (orientation: portrait) and (max-width: 900px) {
            .stage-wrapper {
                flex-direction: column;
                justify-content: flex-start;
                padding: calc(6px + env(safe-area-inset-top)) 8px 8px;
                gap: 8px;
            }
            .hud-overlay {
                position: static;
                width: 100%;
                flex-wrap: wrap;
                gap: 6px;
            }
            .hud-badge { max-width: 100%; }
            /* centre the game in whatever space is left under the HUD */
            canvas#screen, #remoteVideo, #remoteFallbackImg { margin-block: auto; }
            .nexus-touch-bar {
                flex: 0 0 auto;
                min-height: 36dvh;
                display: grid;
                grid-template-columns: auto 1fr auto;
                grid-template-areas: "dpad . ab" "sys sys sys";
                align-items: center;
                row-gap: 14px;
                padding: 16px clamp(12px, 5vw, 32px) calc(14px + env(safe-area-inset-bottom));
            }
            .dpad-grid { grid-area: dpad; }
            .nexus-action-cluster { grid-area: ab; gap: clamp(10px, 4vw, 20px); align-items: flex-start; }
            .nexus-center-btns { grid-area: sys; flex-direction: row; justify-content: center; gap: 18px; }
            .touch-dpad, .dpad-center {
                width: clamp(48px, 15vw, 66px);
                height: clamp(48px, 15vw, 66px);
                font-size: clamp(18px, 5vw, 24px);
            }
            .nexus-circle-btn {
                width: clamp(58px, 18vw, 80px);
                height: clamp(58px, 18vw, 80px);
                font-size: clamp(16px, 5vw, 22px);
            }
            /* classic layout: A sits a little higher than B */
            .btn-action-a { margin-top: 0; }
            .btn-action-b { margin-top: clamp(18px, 6vw, 30px); }
        }

        /* ===== Phone LANDSCAPE: D-pad left, game centre, A/B right (nothing covers the game) ===== */
        @media (orientation: landscape) and (max-height: 600px) and (pointer: coarse) {
            body {
                display: grid;
                grid-template-columns: minmax(170px, 1fr) minmax(0, 2.6fr) minmax(170px, 1fr);
                grid-template-rows: minmax(0, 1fr) auto;
                background: radial-gradient(circle at 50% 50%, #15152a 0%, #05050c 80%);
            }
            .stage-wrapper {
                grid-column: 2;
                grid-row: 1 / span 2;
                height: 100%;
                padding: 6px 0;
                background: transparent;
            }
            .hud-overlay {
                position: fixed;
                top: calc(6px + env(safe-area-inset-top));
                left: calc(6px + env(safe-area-inset-left));
                right: calc(6px + env(safe-area-inset-right));
                align-items: flex-start;
                flex-wrap: nowrap;
            }
            .hud-badge { max-width: calc(25vw - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .hud-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                width: calc(25vw - 16px);
                max-width: 220px;
            }
            .nexus-touch-bar { display: contents; }
            .dpad-grid { grid-column: 1; grid-row: 1; align-self: center; justify-self: center; margin-top: 36px; }
            .nexus-action-cluster { grid-column: 3; grid-row: 1; align-self: center; justify-self: center; margin-top: 64px; }
            .nexus-center-btns { display: contents; }
            #btnSelect { grid-column: 1; grid-row: 2; justify-self: center; margin-bottom: calc(10px + env(safe-area-inset-bottom)); }
            #btnStart { grid-column: 3; grid-row: 2; justify-self: center; margin-bottom: calc(10px + env(safe-area-inset-bottom)); }
            .touch-dpad, .dpad-center { width: clamp(44px, 12vh, 58px); height: clamp(44px, 12vh, 58px); font-size: 20px; }
            .nexus-circle-btn { width: clamp(52px, 15vh, 70px); height: clamp(52px, 15vh, 70px); font-size: 18px; }
            .btn-action-b { margin-top: 24px; }
        }
    </style>
</head>
<body>
    <div class="stage-wrapper">
        <div class="hud-overlay">
            <span id="gameTitleBadge" class="hud-badge">PLAYING GAME</span>
            <div class="hud-actions">
                <button id="btn2PMode" class="hud-btn" style="border-color: var(--accent-yellow); color: var(--accent-yellow);">👥 2P</button>
                <button id="btnToggleSound" class="hud-btn">SFX: ON</button>
                <button id="btnToggleScanlines" class="hud-btn">CRT: ON</button>
                <button id="btnReset" class="hud-btn">RESET</button>
            </div>
        </div>
        <canvas id="screen" width="256" height="240"></canvas>
        <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
        <img id="remoteFallbackImg" style="display:none;" alt="Remote Stream">
        <div id="guestAudioBanner" class="guest-audio-banner" style="display:none;">🔊 TAP TO ENABLE AUDIO</div>
        <div id="scanlines" class="scanlines"></div>
    </div>

    <!-- 2-Player Multiplayer Lobby Modal -->
    <div id="mpBackdrop" class="mp-backdrop">
        <div class="mp-modal">
            <div class="mp-title">👥 2-DEVICE MULTIPLAYER</div>
            <div class="mp-mode-tabs">
                <button id="mpTabStream" class="mp-mode-tab active">🌐 2-SCREEN ONLINE</button>
                <button id="mpTabController" class="mp-mode-tab">📱 PHONE GAMEPAD</button>
            </div>
            <div class="mp-code-box">
                <div class="mp-code-label">ROOM CODE</div>
                <div id="mpRoomCode" class="mp-code-value">....</div>
            </div>
            <div class="mp-qr-wrap">
                <canvas id="mpQrCanvas" width="148" height="148"></canvas>
            </div>
            <div id="mpModeHint" class="mp-hint">
                Scan QR code or share link with Device 2 to watch live & play as Player 2 anywhere!
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; font-family:var(--font-pixel); font-size:8px; padding:6px 10px; background:#070710; border-radius:4px;">
                <span id="mpStatusText" style="color:var(--accent-green);">CREATING ROOM...</span>
                <span id="mpPingText" style="color:var(--accent-cyan);">PING: --</span>
            </div>
            <div class="mp-actions">
                <button id="mpCopyBtn" class="hud-btn" style="border-color: var(--accent-cyan); padding: 9px 14px;">📋 COPY INVITE LINK</button>
                <button id="mpCloseBtn" class="hud-btn" style="border-color: var(--accent-magenta); padding: 9px 14px;">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- Responsive Touch Gamepad -->
    <div class="nexus-touch-bar">
        <!-- D-Pad -->
        <div class="dpad-grid">
            <div class="dpad-row">
                <button id="btnUp" class="touch-btn touch-dpad" aria-label="Up">▲</button>
            </div>
            <div class="dpad-row">
                <button id="btnLeft" class="touch-btn touch-dpad" aria-label="Left">◄</button>
                <div class="dpad-center"></div>
                <button id="btnRight" class="touch-btn touch-dpad" aria-label="Right">►</button>
            </div>
            <div class="dpad-row">
                <button id="btnDown" class="touch-btn touch-dpad" aria-label="Down">▼</button>
            </div>
        </div>

        <!-- Center Select / Start -->
        <div class="nexus-center-btns">
            <button id="btnSelect" class="touch-btn nexus-pill">SELECT</button>
            <button id="btnStart" class="touch-btn nexus-pill">START</button>
        </div>

        <!-- Right Action Buttons -->
        <div class="nexus-action-cluster">
            <button id="btnB" class="touch-btn nexus-circle-btn btn-action-b" aria-label="B Button">B</button>
            <button id="btnA" class="touch-btn nexus-circle-btn btn-action-a" aria-label="A Button">A</button>
        </div>
    </div>

    <!-- Standalone Local Engine Scripts -->
    <script src="js/emulator/jsnes.min.js"></script>
    <script src="js/emulator/gameboy.min.js"></script>
    <script src="js/qr.js"></script>
    <script src="js/netplay.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
