<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlayStation • Nexus Retro Arcade</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #06080e;
            color: #e2e8f0;
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            overflow: hidden;
        }
        #game { width: 100%; height: 100%; }
        .ps1-notice {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .ps1-notice.show { display: flex; }
        .ps1-notice-box {
            max-width: 520px;
            border: 2px solid #ff5376;
            background: #0f1220;
            padding: 24px;
            box-shadow: 6px 6px 0 #6a0e1c;
        }
        .ps1-notice-box h1 { font-size: 18px; color: #ff5376; margin: 0 0 12px; letter-spacing: 1px; }
        .ps1-notice-box p { font-size: 14px; line-height: 1.6; margin: 8px 0; color: #cbd5e1; }
        .ps1-notice-box code { color: #00f0ff; word-break: break-all; }
        .ps1-bios-hint {
            position: absolute;
            left: 8px;
            bottom: 8px;
            font-size: 11px;
            color: #94a3b8;
            background: rgba(6, 8, 14, 0.8);
            padding: 4px 8px;
            border: 1px solid #1e293b;
            display: none;
            z-index: 5;
            pointer-events: none;
        }
        .ps1-bios-hint.show { display: block; }
    </style>
</head>
<body>
    <div id="game"></div>
    <div class="ps1-notice" id="ps1Notice">
        <div class="ps1-notice-box">
            <h1 id="ps1NoticeTitle">💿 NO DISC</h1>
            <div id="ps1NoticeBody"></div>
        </div>
    </div>
    <div class="ps1-bios-hint" id="ps1BiosHint">No PS1 BIOS found: using built-in HLE BIOS. For best compatibility add bios/scph5501.bin</div>
    <script src="js/ps1.js"></script>
</body>
</html>
